name: Generate contribution snake

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # dark + light variants so it adapts to the viewer's GitHub theme
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#161b22,#5b21b6,#1f6feb,#00d4ff,#a5d6ff
            dist/snake-light.svg?palette=github-light&color_snake=#5b21b6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
